# VDOIT — nginx server block
#
# The build prerenders each route to its own index.html, so there is no
# single-page-app fallback here: every URL is a real file. `try_files` only has
# to look for the directory index, and anything genuinely missing gets a real
# 404 rather than the home page.
#
# Point `root` at the deployed `dist/` directory.

server {
    listen 443 ssl;
    http2 on;
    server_name www.vdoitech.com;

    root /var/www/vdoit/dist;
    index index.html;

    # ssl_certificate     /etc/letsencrypt/live/www.vdoitech.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.vdoitech.com/privkey.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;
    # brotli on;
    # brotli_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No trailing slashes, to match the canonical tags the build emits.
    rewrite ^/(.+)/$ /$1 permanent;

    # Hashed assets never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|avif|svg|mp4)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Crawler files.
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt|site\.webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Every page is a prerendered file. `$uri/index.html` covers /services and
    # friends; the =404 is deliberate — do not fall back to /index.html here or
    # every dead link becomes a soft duplicate of the home page.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}

# One canonical origin: redirect the bare domain and plain http to https://www.
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name vdoitech.com;
    # ssl_certificate     /etc/letsencrypt/live/vdoitech.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vdoitech.com/privkey.pem;
    return 301 https://www.vdoitech.com$request_uri;
}

server {
    listen 80;
    server_name www.vdoitech.com;
    return 301 https://www.vdoitech.com$request_uri;
}
